name: Clean old Windows EXE artifacts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/artifact-cleanup.yml'
  schedule:
    - cron: '25 3 * * 0'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove old Windows EXE archives (keep latest two)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            const windows = artifacts
              .filter(artifact => artifact.name === 'LastRitual-Windows' && !artifact.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const obsolete = windows.slice(2);
            let deleted = 0;
            let bytes = 0;
            for (const artifact of obsolete) {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              deleted++;
              bytes += artifact.size_in_bytes || 0;
            }
            core.info(`Windows artifacts found: ${windows.length}; kept: ${Math.min(2, windows.length)}; deleted: ${deleted}; bytes removed: ${bytes}`);
            await core.summary.addHeading('Windows EXE artifact cleanup')
              .addRaw(`Found: ${windows.length}; kept: ${Math.min(2, windows.length)}; deleted: ${deleted}; storage removed: ${(bytes / 1024 / 1024).toFixed(1)} MiB. GitHub usage recalculation may take 6–12 hours.`).write();
