name: Generate Frost Obelisk review candidates (one-shot)
on:
  push:
    branches: [feat/frost-obelisk-modular-pixel-art-candidate]
    paths:
      - .github/workflows/generate-frost-candidates-once.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/frost-obelisk-modular-pixel-art-candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Generate reproducible candidate source assets
        run: |
          set -euo pipefail
          python -m py_compile tools/generate_frost_modular_candidates.py tools/render_frost_modular_preview.py
          python tools/generate_frost_modular_candidates.py --write
          python tools/render_frost_modular_preview.py --all-levels --scale 1 --output assets/spire/towers/frost/candidate/review/contact_sheet_72_1x.png
          python tools/render_frost_modular_preview.py --all-levels --scale 2 --output assets/spire/towers/frost/candidate/review/contact_sheet_72_2x.png
          python tools/render_frost_modular_preview.py --compact --output assets/spire/towers/frost/candidate/review/contact_sheet_9_1x.png
          python -m unittest discover -s tests -p 'test_frost_modular_candidates.py' -v
          git add assets/spire/towers/frost/manifest.json assets/spire/towers/frost/candidate
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Generate Frost Obelisk modular Pixel Art review candidates'
          git push origin HEAD:feat/frost-obelisk-modular-pixel-art-candidate
