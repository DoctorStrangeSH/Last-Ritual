name: Repair candidate PNG (one-shot)
on:
  push:
    branches: [art/soul-altar-base-weapon-v4]
    paths: [.github/workflows/repair-necro-candidate.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/soul-altar-base-weapon-v4
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Regenerate from checked-in editable source and push
        run: |
          python tools/generate_necro_modular_candidates.py
          python tools/generate_necro_modular_candidates.py --verify
          git add assets/spire/towers/necro/candidate/weapon/base/weapon_8way.png
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Regenerate candidate Soul Altar PNG from pixel source'
            git push origin HEAD:art/soul-altar-base-weapon-v4
          fi
