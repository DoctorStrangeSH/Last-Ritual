name: Import original Soul Altar PNG bundle from owner comment
on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  import-art:
    # Only the repository owner can request this exact, SHA-pinned import.
    if: ${{ github.event.issue.number == 300 && github.event.comment.user.login == github.repository_owner && contains(github.event.comment.body, 'IMPORT_SOUL_ALTAR_V05') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout the main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Extract the GitHub-hosted attachment link
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python - <<'PY'
          import os, re
          body = os.environ["COMMENT_BODY"]
          urls = re.findall(r"https://github\.com/user-attachments/(?:assets|files)/[a-zA-Z0-9_.%/-]+", body)
          if len(urls) != 1:
              raise SystemExit("Exactly one GitHub-hosted ZIP attachment must follow IMPORT_SOUL_ALTAR_V05.")
          if not urls[0].endswith(".zip") and "/assets/" not in urls[0]:
              raise SystemExit("Attachment must be a ZIP")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("SOUL_ART_URL=" + urls[0] + "\n")
          PY
      - name: Download verified ZIP from GitHub's attachments
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 120 "$SOUL_ART_URL" -o "$RUNNER_TEMP/SoulAltar.zip"
          echo "3fb39c9b1d8ca69502a72ec371094a7c08f5c451bb0769cabfb04633218bce68  $RUNNER_TEMP/SoulAltar.zip" | sha256sum --check --status
      - name: Verify every original source and import all 16 PNGs
        run: |
          python -m pip install --quiet Pillow
          python tools/import_necro_git_bundle.py "$RUNNER_TEMP/SoulAltar.zip"
          test "$(find assets/spire/towers/necro/production -maxdepth 1 -name '*.png' | wc -l)" -eq 16
          test "$(find assets/spire/towers/necro/source/original -maxdepth 1 -name '*.png' | wc -l)" -eq 5
      - name: Save complete binaries on an isolated review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="art/necro-original-v05-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add assets/spire/towers/necro/production/ assets/spire/towers/necro/source/original/ assets/spire/towers/necro/source/concepts/
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "art(necro): preserve complete original v0.5 HD tower, VFX and sprite sources"
          git push origin "HEAD:refs/heads/$branch"
          echo "### Original Soul Altar PNGs saved in Git" >> "$GITHUB_STEP_SUMMARY"
          echo "Review branch: \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
          echo "16 production PNGs and all original sources preserved with exact hashes." >> "$GITHUB_STEP_SUMMARY"
          echo "Manual PR + CI approval required before main, EXE, or deletion of old placeholders." >> "$GITHUB_STEP_SUMMARY"
