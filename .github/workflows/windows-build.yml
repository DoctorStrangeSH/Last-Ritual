name: Godot checks and Windows preview
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/windows-build.yml'
  push:
    branches: [main]
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/windows-build.yml'

# New commits supersede obsolete runs of the same PR/branch.
concurrency:
  group: godot-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot 4.4.1 editor
        id: editor-cache
        uses: actions/cache@v4
        with:
          path: Godot_v4.4.1-stable_linux.x86_64
          key: godot-4.4.1-linux-x86_64-editor-v1
      - name: Install Godot 4.4.1 editor
        if: steps.editor-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
      - name: Verify source art importer (no archive required)
        run: python3 -m unittest discover -s tests -p 'test_source_art_import.py' -v
      - name: Test approved Soul Altar archive import integrity
        run: python3 -m unittest discover -s tests -p 'test_install_approved_soul_altar_zip.py' -v
      - name: Validate PNG assets before Godot import
        run: python3 tools/verify_png_assets.py
      - name: Import assets and check scripts
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Validate original Soul Altar ZIP importers syntax
        run: python -m py_compile tools/import_necro_original_art.py tools/install_necro_full_pack.py
      - name: Compile verified Soul Altar Git importer
        run: python -m py_compile tools/import_necro_git_bundle.py
      - name: Reject invalid Soul Altar Pixel Art atlases
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/soul_altar_art_gate.gd
      - name: Validate standalone Soul Altar preview exporter
        run: |
          python -m py_compile tools/export_soul_altar_preview.py
          python3 -m unittest discover -s tests -p 'test_export_soul_altar_preview.py' -v
          python tools/export_soul_altar_preview.py --dry-run
      - name: Compile Soul Altar review frame exporter
        run: python -m py_compile tools/export_soul_altar_review_frames.py
      - name: Validate assembled Soul Altar Pixel Art review source
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/soul_altar_assembled_review_smoke.gd
      - name: Verify reproducible modular Pixel Art source
        run: |
          python -m pip install Pillow
          python tools/generate_necro_modular_candidates.py --verify
          python -m py_compile tools/render_necro_modular_preview.py
          python3 -m unittest discover -s tests -p 'test_necro_modular_preview.py' -v
          python3 -m unittest discover -s tests -p 'test_necro_modular_vfx.py' -v
      - name: Render modular Soul Altar review sheet
        run: |
          python tools/render_necro_modular_preview.py --all-levels
          python -c "from PIL import Image; im=Image.open('build/soul_altar_modular_contact_sheet.png'); assert im.size == (2156, 3312), im.size"
      - name: Validate candidate Soul Altar modular Pixel Art
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/soul_altar_modular_candidate_smoke.gd
      - name: Run isolated Soul Altar modular motion preview smoke tests
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/soul_altar_modular_motion_preview_smoke.gd
      - name: Run modular tower asset contract tests
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/td_modular_tower_assets_smoke.gd
      - name: Run top-down smoke tests
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/topdown_smoke.gd

  windows-preview:
    # Export templates and EXE are never downloaded/built for PRs.
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot 4.4.1 editor
        id: editor-cache
        uses: actions/cache@v4
        with:
          path: Godot_v4.4.1-stable_linux.x86_64
          key: godot-4.4.1-linux-x86_64-editor-v1
      - name: Install Godot 4.4.1 editor
        if: steps.editor-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
      - name: Cache Windows export templates
        id: export-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.4.1.stable
          key: godot-4.4.1-windows-export-templates-v1
      - name: Install Windows export templates
        if: steps.export-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          cp templates/* ~/.local/share/godot/export_templates/4.4.1.stable/
      - name: Export Windows EXE
        run: |
          mkdir -p build/windows
          timeout 180s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/windows/LastRitual.exe
          test -s build/windows/LastRitual.exe
      - name: Export standalone Soul Altar art preview EXE
        run: |
          python tools/export_soul_altar_preview.py --godot ./Godot_v4.4.1-stable_linux.x86_64 --output build/windows/LastRitual-ArtPreview.exe
          test -s build/windows/LastRitual-ArtPreview.exe
          grep -F 'run/main_scene="res://scenes/run_loop.tscn"' project.godot
      # Reuse the same rolling Release asset: no Actions artifact storage.
      - name: Publish Windows EXE to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view windows-preview >/dev/null 2>&1; then
            gh release upload windows-preview build/windows/LastRitual.exe build/windows/LastRitual-ArtPreview.exe --clobber
          else
            gh release create windows-preview build/windows/LastRitual.exe build/windows/LastRitual-ArtPreview.exe \
              --target "$GITHUB_SHA" \
              --title "Last Ritual — Windows preview" \
              --notes "Тестовая Windows-сборка из main; заменяется при следующей успешной сборке." \
              --prerelease
          fi
          echo "Game: https://github.com/$GITHUB_REPOSITORY/releases/download/windows-preview/LastRitual.exe"
          echo "Art preview: https://github.com/$GITHUB_REPOSITORY/releases/download/windows-preview/LastRitual-ArtPreview.exe"

      - name: Publish modular art REVIEW sheet (not final game art)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install Pillow
          python tools/render_necro_modular_preview.py --level 3
          gh release upload windows-preview build/soul_altar_modular_contact_sheet.png --clobber
