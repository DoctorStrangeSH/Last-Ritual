name: Rebuild Reaper candidate (temporary)
on:
  push:
    branches: [art/soul-altar-reaper-scythe-v5]
    paths: [.github/workflows/regenerate-reaper-once.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/soul-altar-reaper-scythe-v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Regenerate checked-in Reaper atlas
        run: |
          python tools/generate_necro_modular_candidates.py
          python tools/generate_necro_modular_candidates.py --verify
          python3 -m unittest discover -s tests -p 'test_necro_weapon_silhouettes.py' -v
          git add assets/spire/towers/necro/candidate/weapon/reaper/weapon_8way.png
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Regenerate Reaper v5 candidate atlas'
            git push origin HEAD:art/soul-altar-reaper-scythe-v5
          fi
