name: Import owner-approved Soul Altar RGBA archive
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Approved art release tag"
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    if: >-
      (github.event_name == 'release' && github.event.release.tag_name == 'soul-altar-approved-rgba-v1') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag == 'soul-altar-approved-rgba-v1')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download the exact approved ZIP from this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/approved-art
          gh release download soul-altar-approved-rgba-v1 --pattern 'LastRitual_SoulAltar_Approved_RGBA_Source_and_Sprites.zip' --dir /tmp/approved-art
          test -s /tmp/approved-art/LastRitual_SoulAltar_Approved_RGBA_Source_and_Sprites.zip
      - name: Verify and install original source PNGs without modification
        run: |
          python3 -m unittest discover -s tests -p 'test_install_approved_soul_altar_zip.py' -v
          python3 tools/install_approved_soul_altar_zip.py /tmp/approved-art/LastRitual_SoulAltar_Approved_RGBA_Source_and_Sprites.zip
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              "source/level_1_original.png": "a131a909d39b654caf8a3676ea8f3c4581f867de526d1f56e34efcd44b8a2caf",
              "source/level_2_original.png": "4589b4e3c5db6ff2f2a8e99f75858f03cb281aeb1431fc6dc56d313fab823959",
              "source/level_3_original.png": "5c014b3a68b25330fdb5b26628fb35523a645e411c9e561d86bf1b473986259f",
              "source/reaper_original.png": "919cf3ce1982cb296104a6ec9b0a89931e6c839921c18337722ea8673628844e",
              "sprites/level_1.png": "173b739691cecfaff840146c0e2d9405c63fff8ef471999a9d0f8851293ef904",
              "sprites/level_2.png": "1a66a6284d3e632903550b989b3d8922be94112217ecd053b103285cc952ccf3",
              "sprites/level_3.png": "88e47ea6d9f4118a34761bcff032222705ac3885323d9509255289c6feefc98b",
              "sprites/reaper.png": "fa49bebfb21318bd4f7de4fdf17618a929555306e6727f79d76221054445e429"
          }
          root = Path("assets/spire/towers/necro/approved_renders")
          for name, digest in expected.items():
              actual = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"Unexpected image content: {name}")
          print("All 8 approved original and sprite PNG hashes match")
          PY
      - name: Save approved sources and sprites in a Git branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="art/approved-soul-altar-rgba-v1"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add assets/spire/towers/necro/approved_renders
          git commit -m "Art: preserve approved Soul Altar PNG originals and sprites"
          git push origin HEAD:"$branch"
          gh pr create --base main --head "$branch" --title "Art: approved Soul Altar RGBA sources + 192px sprites" --body "Review only: unchanged approved source PNGs, exact sprite PNGs and SHA256 manifest. Not a complete eight-way modular kit. Runtime still disabled. No redesign."
