name: Regenerate altar base contrast candidates (temporary)
on:
  push:
    branches: [art/soul-altar-base-contrast-v4]
    paths: [.github/workflows/regenerate-altar-contrast-once.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/soul-altar-base-contrast-v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Regenerate only three changed base PNGs
        run: |
          python tools/generate_necro_modular_candidates.py
          python tools/generate_necro_modular_candidates.py --verify
          python3 -m unittest discover -s tests -p 'test_necro_base_readability.py' -v
          git add assets/spire/towers/necro/candidate/base/level_1.png assets/spire/towers/necro/candidate/base/level_2.png assets/spire/towers/necro/candidate/base/level_3.png
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Regenerate Soul Altar contrast candidate bases'
            git push origin HEAD:art/soul-altar-base-contrast-v4
          fi
