name: Generate Bone Ballista review candidates (one-shot)
on:
  push:
    branches: [feat/ballista-modular-pixel-art-candidate]
    paths:
      - .github/workflows/generate-ballista-candidates-once.yml
      - tools/generate_ballista_modular_candidates.py
      - tools/render_ballista_modular_preview.py
      - tests/test_ballista_modular_candidates.py
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ballista-modular-pixel-art-candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Regenerate review sheets with readable labels
        run: |
          set -euo pipefail
          python -m py_compile tools/generate_ballista_modular_candidates.py tools/render_ballista_modular_preview.py
          python tools/generate_ballista_modular_candidates.py --verify
          python tools/render_ballista_modular_preview.py --all-levels --scale 1 --output assets/spire/towers/ballista/candidate/review/contact_sheet_72_1x.png
          python tools/render_ballista_modular_preview.py --all-levels --scale 2 --output assets/spire/towers/ballista/candidate/review/contact_sheet_72_2x.png
          python tools/render_ballista_modular_preview.py --compact --output assets/spire/towers/ballista/candidate/review/contact_sheet_9_1x.png
          python -m unittest discover -s tests -p 'test_ballista_modular_candidates.py' -v
          git add assets/spire/towers/ballista/candidate/review
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh Ballista review sheets with readable labels'
          git push origin HEAD:feat/ballista-modular-pixel-art-candidate
