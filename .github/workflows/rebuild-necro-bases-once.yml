name: Rebuild candidate bases (one-shot)
on:
  push:
    branches: [art/soul-altar-base-levels-v3]
    paths: [.github/workflows/rebuild-necro-bases-once.yml]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/soul-altar-base-levels-v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Regenerate three candidate bases from source
        run: |
          python tools/generate_necro_modular_candidates.py
          python tools/generate_necro_modular_candidates.py --verify
          git add assets/spire/towers/necro/candidate/base/level_1.png assets/spire/towers/necro/candidate/base/level_2.png assets/spire/towers/necro/candidate/base/level_3.png
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Regenerate three candidate Soul Altar base atlases'
            git push origin HEAD:art/soul-altar-base-levels-v3
          fi
