name: Windows build
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'scenes/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/windows-build.yml'
permissions:
  contents: write
jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1 and export templates
        run: |
          set -euxo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.4.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          mkdir -p ~/.local/share/godot/export_templates/4.4.1.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q Godot_v4.4.1-stable_export_templates.tpz
          cp templates/* ~/.local/share/godot/export_templates/4.4.1.stable/
      - name: Import assets and check scripts
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Run top-down smoke tests
        run: timeout 120s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tests/topdown_smoke.gd
      - name: Export Windows EXE
        run: |
          mkdir -p build/windows
          timeout 180s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/windows/LastRitual.exe
          test -s build/windows/LastRitual.exe
      # GitHub can exhaust shared artifact quota independently of build/test success.
      # Keep script tests and Windows export as mandatory quality gates.
      - name: Upload Windows EXE (best effort when artifact quota is exhausted)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LastRitual-Windows
          path: build/windows/*
          if-no-files-found: error
          retention-days: 3

      # Release assets do not consume the GitHub Actions artifact storage quota.
      # Only validated main commits publish a stable Windows preview download.
      - name: Publish downloadable Windows EXE to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view windows-preview >/dev/null 2>&1; then
            gh release upload windows-preview build/windows/LastRitual.exe --clobber
          else
            gh release create windows-preview build/windows/LastRitual.exe \
              --target "$GITHUB_SHA" \
              --title "Last Ritual — Windows preview" \
              --notes "Автоматическая тестовая сборка из main. Обновляется после успешных проверок Godot и экспорта Windows." \
              --prerelease
          fi
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/windows-preview/LastRitual.exe"
